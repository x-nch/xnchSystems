# Guard against a repeat of the prior plaintext-credentials finding: every
# push/PR is scanned for secrets before merge. Runs upstream gitleaks with its
# maintained detection rules; no repo secrets are required (GITHUB_TOKEN is
# provided automatically by Actions for public repos).
name: secret-scan

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: detect committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
