apiVersion: v1
kind: ServiceAccount
metadata:
  name: codegen-agent
  namespace: xnch-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codegen-agent-readonly
  namespace: xnch-system
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "secrets", "persistentvolumeclaims", "endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codegen-agent-readonly-binding
  namespace: xnch-system
subjects:
- kind: ServiceAccount
  name: codegen-agent
  namespace: xnch-system
roleRef:
  kind: Role
  name: codegen-agent-readonly
  apiGroup: rbac.authorization.k8s.io