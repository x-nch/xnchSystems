apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexi
  namespace: xnch-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexi
  template:
    metadata:
      labels:
        app: nexi
    spec:
      hostAliases:
        # DNS workaround: flannel VXLAN cross-node broken (i7 node-ip mismatch)
        # Remove after CLUSTER-1 fix (K3s node-ip reconfigured to 192.168.50.1)
        - ip: "10.43.100.18"
          hostnames: ["xnch"]
        - ip: "10.43.15.158"
          hostnames: ["litellm"]
        - ip: "10.43.2.230"
          hostnames: ["mem0"]
        - ip: "10.43.31.250"
          hostnames: ["langfuse"]
        - ip: "10.43.237.186"
          hostnames: ["vllm-gemma4"]
      nodeSelector:
        role: inference
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nexi
          image: xnch/nexi-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: NEXI_XNCH_BASE_URL
              value: http://xnch:8001
            - name: NEXI_VLLM_PRIMARY_URL
              value: http://vllm-gemma4:8000/v1
            - name: NEXI_LITELLM_PROXY_URL
              value: http://litellm:4000/v1
            - name: NEXI_REDIS_URL
              value: redis://redis:6379/0
            - name: NEXI_EXECUTION_RUNNER_URL
              value: http://execution-runner:8002
          resources:
            limits:
              memory: "2Gi"
              cpu: "2"
            requests:
              memory: "1Gi"
              cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: nexi
  namespace: xnch-system
spec:
  selector:
    app: nexi
  ports:
    - port: 8000
      targetPort: 8000
