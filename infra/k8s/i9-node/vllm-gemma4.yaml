---
# vllm-gemma4: routes to host-level llama-server (gemma4-llama.service systemd)
# llama-server runs on xnch-core host, NOT in Kubernetes
# Model: gemma-4-26B-A4B-it-Q4_K_M.gguf via llama.cpp TurboQuant
# 20.9GB VRAM @ idle — too large for K8s pod lifecycle
apiVersion: v1
kind: Service
metadata:
  name: vllm-gemma4
  namespace: xnch-system
spec:
  ports:
    - port: 8000
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: vllm-gemma4
  namespace: xnch-system
subsets:
  - addresses:
      - ip: 192.168.50.2
    ports:
      - port: 8080
        protocol: TCP
