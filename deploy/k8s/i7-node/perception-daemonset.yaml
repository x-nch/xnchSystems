apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: perception
  namespace: xnch-system
  annotations:
    xnch.io/status: "image-not-yet-built"
    xnch.io/blocked-by: "perception service not yet implemented"
spec:
  selector:
    matchLabels:
      app: perception
  template:
    metadata:
      labels:
        app: perception
    spec:
      nodeSelector:
        role: memory # GTX 1650 present but no driver — no GPU scheduling
      containers:
        - name: perception
          image: xnch/perception:latest
          ports:
            - containerPort: 8002
          resources:
            limits:
              memory: "3Gi"
              cpu: "2"
            requests:
              memory: "1.5Gi"
              cpu: "1"
          env:
            - name: XNCH_REDIS_URL
              value: redis://redis:6379/0
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: XNCH_POSTGRES_URL
              value: postgresql://xnch:$(POSTGRES_PASSWORD)@postgres-pgvector:5432/xnch
          volumeMounts:
            - name: vault
              mountPath: /vault
            - name: devinput
              mountPath: /dev/input
      volumes:
        - name: vault
          persistentVolumeClaim:
            claimName: xnch-vault
        - name: devinput
          hostPath:
            path: /dev/input
