apiVersion: apps/v1
kind: Deployment
metadata:
  name: xnch
  namespace: xnch-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: xnch
  template:
    metadata:
      labels:
        app: xnch
    spec:
      nodeSelector:
        role: memory
      containers:
        - name: xnch
          image: xnch/xnch-server:latest
          ports:
            - containerPort: 8001
          env:
            - name: XNCH_REDIS_URL
              value: redis://redis:6379/0
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: xnch-secret
                  key: postgres_password
            - name: XNCH_POSTGRES_URL
              value: postgresql://xnch:$(POSTGRES_PASSWORD)@postgres-pgvector:5432/xnch
            - name: XNCH_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: xnch-secret
                  key: auth_secret
          resources:
            limits:
              memory: "1.5Gi"
              cpu: "1"
            requests:
              memory: "768Mi"
              cpu: "500m"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: xnch-data
---
apiVersion: v1
kind: Service
metadata:
  name: xnch
  namespace: xnch-system
spec:
  selector:
    app: xnch
  ports:
    - port: 8001
      targetPort: 8001
