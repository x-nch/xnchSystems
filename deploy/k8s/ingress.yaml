apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: xnch-route
  namespace: xnch-system
spec:
  entryPoints: [web]
  routes:
    - match: Host(`xnch.local`)
      kind: Rule
      services:
        - name: xnch
          port: 8001
---
