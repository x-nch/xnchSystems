apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: xnch-system
data:
  config.yaml: |
    model_list:
      - model_name: gemma4-local
        litellm_params:
          model: ollama/gemma4:26b
          api_base: http://i9-node:11434
      - model_name: claude-judgment
        litellm_params:
          model: anthropic/claude-sonnet-4-6
      - model_name: phi3-encoder
        litellm_params:
          model: ollama/phi3:mini
          api_base: http://i7-node:11434

    router_settings:
      routing_strategy: usage-based-routing
      fallbacks:
        - "gemma4-local": ["claude-judgment"]
      allowed_fails: 3
      num_retries: 2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mem0-config
  namespace: xnch-system
data:
  mem0.yaml: |
    version: v1.1
    vector_store:
      provider: pgvector
      config:
        host: postgres-pgvector
        port: 5432
        dbname: xnch
        collection_name: mem0_memories
    embedder:
      provider: ollama
      config:
        model: nomic-embed-text
        base_url: http://i7-node:11434
