apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexi
  namespace: xnch-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexi
  template:
    metadata:
      labels:
        app: nexi
    spec:
      nodeSelector:
        role: inference
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nexi
          image: xnch/nexi-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: NEXI_XNCH_BASE_URL
              value: http://xnch:8001
            - name: NEXI_VLLM_PRIMARY_URL
              value: http://vllm-gemma4:8000/v1
            - name: NEXI_LITELLM_PROXY_URL
              value: http://litellm:4000/v1
            - name: NEXI_REDIS_URL
              value: redis://redis:6379/0
          resources:
            limits:
              memory: "2Gi"
              cpu: "2"
            requests:
              memory: "1Gi"
              cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: nexi
  namespace: xnch-system
spec:
  selector:
    app: nexi
  ports:
    - port: 8000
      targetPort: 8000
