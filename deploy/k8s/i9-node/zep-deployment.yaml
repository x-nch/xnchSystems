apiVersion: apps/v1
kind: Deployment
metadata:
  name: zep
  namespace: xnch-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zep
  template:
    metadata:
      labels:
        app: zep
    spec:
      nodeSelector:
        role: inference
      containers:
        - name: zep
          image: ghcr.io/getzep/zep:latest
          ports:
            - containerPort: 8080
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: ZEP_STORE_POSTGRES_DSN
              value: postgresql://xnch:$(POSTGRES_PASSWORD)@postgres-pgvector:5432/xnch
            - name: ZEP_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: zep-secret
                  key: openai_api_key
          resources:
            limits:
              memory: "1Gi"
              cpu: "1"
            requests:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: zep
  namespace: xnch-system
spec:
  selector:
    app: zep
  ports:
    - port: 8080
      targetPort: 8080
