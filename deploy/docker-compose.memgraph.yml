version: "3.9"
services:
  memgraph:
    image: memgraph/memgraph:latest
    ports:
      - "7687:7687"
      - "7444:7444"
    volumes:
      - memgraph-data:/var/lib/memgraph
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7444"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  memgraph-data:
