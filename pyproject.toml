[project]
name = "xnchsystems"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "httpx>=0.28.1",
    "kuzu>=0.11.3",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-postgres>=3.1.0",
    "litellm>=1.89.4",
    "pyjwt>=2.8",
    "typer>=0.12",
    "mcp>=1.0",
    "anyio>=4.0",
    "PyYAML>=6.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
xnch-cli = "cli.main:app"
xnch-mcp = "xnch_mcp.stdio_server:main"
fs-read-agent = "fs_read_agent.server:main"
exec-agent = "exec_agent.server:main"
docs-test-mcp = "docs_test_mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["nexi/tests", "xnch/tests", "tests", "xnch_mcp/tests", "fs_read_agent/tests", "docs_test_mcp/tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
voice = [
    "faster-whisper>=1.0",
    "numpy>=1.26",
    "sounddevice>=0.5",
]
voice-client = [
    "numpy>=1.26",
    "sounddevice>=0.5",
]
