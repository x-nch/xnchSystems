[project]
name = "xnchsystems"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "agentmemory>=0.4.8",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "httpx>=0.28.1",
    "kuzu>=0.11.3",
    "litellm>=1.89.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["nexi/tests", "xnch/tests", "tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
